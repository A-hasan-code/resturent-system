services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel_secret}
      POSTGRES_DB: ${POSTGRES_DB:-hotel_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hotel_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotel} -d ${POSTGRES_DB:-hotel_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: hotel-system-api:1.0.0
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: hotel-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hotel}:${POSTGRES_PASSWORD:-hotel_secret}@postgres:5432/${POSTGRES_DB:-hotel_db}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 4000
      NODE_ENV: production
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    image: hotel-system-web:1.0.0
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    container_name: hotel-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  hotel_pg_data:
