# Render Blueprint — one web service + Postgres.
# Dashboard: New → Blueprint → connect this GitHub repo → apply.
# Branch defaults to improve-the-system (change below if needed).

databases:
  - name: hotel-db
    plan: basic-256mb
    databaseName: hotel_db
    user: hotel

services:
  - type: web
    name: hotel-system
    runtime: node
    plan: starter
    region: singapore
    branch: improve-the-system
    autoDeploy: true
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/health
    disk:
      name: hotel-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DISCOVERY_DISABLED
        value: "1"
      - key: HOTEL_DATA_DIR
        value: /var/data
      - key: WEB_DIST
        value: ../web/dist
      # First deploy: seeds admin/supervisor/cashier demo users. Set to 0 after first boot.
      - key: HOTEL_SEED_ON_BOOT
        value: "1"
      - key: TZ
        value: Asia/Karachi
